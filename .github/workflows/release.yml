name: Release fonts
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check tag matches font version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const c=require("./font.config.json"); if(process.env.TAG!=="v"+c.version) process.exit(1)'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run check && npm test
      - run: npm run font:fetch
      - run: npm run build
      - run: npm run package
      - name: Publish verified fonts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/release/*.zip dist/release/SHA256SUMS.txt dist/*.otf dist/CommonChineseEnglishSans-Regular.woff2 --verify-tag --generate-notes --title "$TAG"
